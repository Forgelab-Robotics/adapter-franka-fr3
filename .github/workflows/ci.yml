name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.12.5
      - name: Sync locked environment
        run: uv sync --frozen --all-groups
      - name: Validate package build
        run: uv build
      - name: Unit tests
        run: uv run pytest -q
      - name: Verify CLI
        run: |
          uv run robots-franka-fr3 --help
          test "$(uv run robots-franka-fr3 --version)" = "franka-fr3 0.1.0"
          test "$(uv run python -m robots_franka_fr3 --version)" = "franka-fr3 0.1.0"
          uv run python src/robots_franka_fr3/node.py --help
      - name: Import public Forge packages
        run: uv run python -c "import forge_common, forge_msgs, forge_robot, robots_franka_fr3"
      - name: Load MuJoCo model
        run: >-
          uv run python -c "import mujoco;
          model=mujoco.MjModel.from_xml_path('assets/mjcf/scene.xml');
          print(f'MuJoCo model loaded: nq={model.nq}, nu={model.nu}')"
      - name: License and public-tree checks
        run: |
          test -f LICENSE
          test -f NOTICE
          test -f THIRD_PARTY_NOTICES.md
          test -f OPEN_SOURCE_AUDIT.md
          test -f assets/SOURCE_MANIFEST.json
          test -f assets/mjcf/PROVENANCE.json
          ! git grep -n -E 'gitlab\.ex-ai\.cn|meta-emt|/home/|/Users/' -- ':!.github/workflows/ci.yml'

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.12.5
      - name: Export and audit locked runtime dependencies
        run: |
          uv export --frozen --format requirements-txt --no-dev --no-emit-project --output-file /tmp/requirements.txt
          # franky-control wheels are served from the public franky index
          # (robot-server 9), not PyPI; audit the PyPI-resolvable subset.
          python - <<'PY'
          import pathlib
          lines = pathlib.Path("/tmp/requirements.txt").read_text().splitlines()
          filtered, skip = [], False
          for line in lines:
              if line.startswith("franky-control=="):
                  skip = True
                  continue
              if skip and (line.startswith(" ") or line.startswith("#")):
                  continue
              skip = False
              filtered.append(line)
          pathlib.Path("/tmp/requirements.txt").write_text("\n".join(filtered) + "\n")
          PY
          uvx pip-audit --requirement /tmp/requirements.txt

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Scan publishable text for secrets
        run: |
          python -m pip install detect-secrets==1.5.0
          detect-secrets scan --all-files --exclude-files \
            '^(\.git/|\.venv/|\.pytest_cache/|dist/|build/|validation_output/|assets/meshes/|assets/SOURCE_MANIFEST\.json|assets/mjcf/PROVENANCE\.json|examples/03_workflows/paos_move_arm_by_ee/skill/skill\.yaml|scripts/(sync_franka_description_assets|validate_assets)\.py)' \
            > /tmp/secrets.json
          python - <<'PY'
          import json
          with open("/tmp/secrets.json", encoding="utf-8") as stream:
              findings = json.load(stream).get("results", {})
          if findings:
              raise SystemExit(f"Potential secrets detected: {findings}")
          PY
