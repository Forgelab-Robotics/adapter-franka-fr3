state_timeout_ms: 500
planning_timeout_ms: 500
execution_timeout_margin_ms: 5000
final_state_timeout_ms: 500
child_cancel_retry_ms: 100
child_cancel_timeout_ms: 2000
result_cache_size: 128

groups:
  fr3v2_arm: &fr3v2_arm
    joint_names:
      - fr3v2_joint1
      - fr3v2_joint2
      - fr3v2_joint3
      - fr3v2_joint4
      - fr3v2_joint5
      - fr3v2_joint6
      - fr3v2_joint7
    urdf_path: ../../assets/urdf/fr3v2_franka_hand.urdf
    base_frame: fr3v2_link0
    tip_frame: fr3v2_hand_tcp
    # 这里是规划器上限；Gateway 对真实 profile 还把 scale 限制在 0.1。
    max_velocity:
      fr3v2_joint1: 0.5
      fr3v2_joint2: 0.5
      fr3v2_joint3: 0.5
      fr3v2_joint4: 0.5
      fr3v2_joint5: 0.5
      fr3v2_joint6: 0.5
      fr3v2_joint7: 0.5
    max_acceleration:
      fr3v2_joint1: 0.5
      fr3v2_joint2: 0.5
      fr3v2_joint3: 0.5
      fr3v2_joint4: 0.5
      fr3v2_joint5: 0.5
      fr3v2_joint6: 0.5
      fr3v2_joint7: 0.5
    trajectory_sample_period_ms: 50
    max_trajectory_points: 10000
    start_velocity_tolerance: 0.10
    final_joint_tolerance: 0.015
    final_position_tolerance_m: 0.01
    final_orientation_tolerance_rad: 0.10
    ik_max_solution_joint_displacement: 0.35
