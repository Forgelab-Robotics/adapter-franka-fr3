robot:
  backend: fake

safety:
  relative_dynamics_factors: {velocity: 0.03, acceleration: 0.03, jerk: 0.03}
  position_margin_rad: 0.10

control:
  action_timeout_s: 2.0
  state_timeout_s: 0.5
  motion_timeout_s: 60.0
  gripper_timeout_s: 10.0
  homing_timeout_s: 15.0
  worker_join_timeout_s: 2.0
  worker_period_s: 0.02
  min_command_interval_s: 0.05
  position_command_semantics: absolute
  max_step_rad: 0.02
  gripper_speed_mps: 0.02
  gripper_force_n: 20.0
  require_homing: false
  allow_real_motion: false
